name: Terraform CI

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_WORKING_DIR: parent_module/prod
  TF_VERSION: "1.13.3"
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Azure OIDC Authentication
      # --------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------
      # Terraform Setup
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------
      # Terraform Format
      # --------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # --------------------------------------------------
      # Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # --------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------
      - name: Terraform Validate
        run: terraform validate -no-color

      # --------------------------------------------------
      # Gitleaks - Secret Scan
      # --------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      # --------------------------------------------------
      # Upload Terraform Plan
      # --------------------------------------------------
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7

      # --------------------------------------------------
      # Automatically Create Pull Request
      # --------------------------------------------------
      - name: Create Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list \
            --head "${GITHUB_REF_NAME}" \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$PR_COUNT" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --title "Terraform Infrastructure Changes - ${GITHUB_REF_NAME}" \
              --body "## Terraform CI Passed

          The following checks have successfully completed:

          - Terraform Format
          - Terraform Init
          - Terraform Validate
          - TFLint
          - Checkov
          - Gitleaks
          - Terraform Plan

          Terraform plan artifact has been generated for commit:
          \`${GITHUB_SHA}\`

          Please review the changes before merging." \
              --reviewer tktusharkumar95-png
          else
            echo "An open Pull Request already exists for ${GITHUB_REF_NAME}."
          fi